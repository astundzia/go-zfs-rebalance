name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      # Passed through the environment so the tag name never becomes part of a script.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Build release binaries from a clean slate, not from caches other runs wrote.
          cache: false
      - name: Tests
        run: go test ./...
      - name: Build the release files
        run: make dist VERSION="$TAG"
      - name: Write the release notes from CHANGELOG.md
        run: |
          awk -v want="## [${TAG#v}]" '
            /^## \[/ { if (found) exit; if (index($0, want) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Release $TAG. See CHANGELOG.md for the details." >notes.md
          fi
          cat notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set --
          case "$TAG" in
            *-*) set -- --prerelease ;;
          esac
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md "$@"
